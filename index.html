<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Search | Home</title>
    <script src="src/js/fuse.js"></script>
    <script src="https://kit.fontawesome.com/2aac6f8878.js" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="/src/static/body.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <div class="d-flex align-items-center">
                <div class="navbar-brand"><a href="./index.html" class="nav-link text-light">ShopSearch</a></div>
                <a href="./src/www/manage_shops.html" class="btn btn-secondary ms-3">
                    Manage Shops
                </a>
            </div>
            <div class="ms-auto">
                <form>
                    <!-- Register buttons -->
                    <div class="text-end">
                        <button type="button" data-mdb-button-init data-mdb-ripple-init class="btn btn-primary btn-block mb-1">
                            <i class="fa-brands fa-discord fs-3 mx-3"></i>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </nav>


    <div class="content container">
        <div class="form-group p-2">
            <label for="Search"><h2>Enter item to buy</h2></label>
            <input type="text" class="form-control" id="Search" placeholder="Dark oak wood...">
        </div>
        
        <ul id="results" class="list-group p-2"></ul>
    </div>

    <footer>
        <div class="container">
            <p class="mb-0">&copy; 2025 Copyright: <a class="text-white" target="_blank" href="https://creativecommons.org/licenses/by-nc-nd/4.0/legalcode.txt">ArdynFallSMP & KaiyWhiteSnow.</a></p>
        </div>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/fuse.js/6.4.6/fuse.min.js"></script>
    <script>
        let fuse; 
        const resultsList = document.getElementById("results");
        const searchInput = document.getElementById("Search");

        fetch("/src/json/items.json")
            .then(response => response.json())
            .then(data => {
                const fuseOptions = {
                    keys: ["name", "source"],
                    threshold: 0.3
                };
                fuse = new Fuse(data, fuseOptions);

                searchInput.addEventListener("input", () => {
                    const searchPattern = searchInput.value;
                    const results = fuse.search(searchPattern);
                    displayResults(results);
                });
            })
            .catch(error => {
                console.error("Error loading items:", error);
                resultsList.innerHTML = "<li class='list-group-item'>Error loading items.</li>";
            });

        function displayResults(results) {
            resultsList.innerHTML = "";
            
            results.forEach(result => {
                const item = result.item;
                const li = document.createElement("li");
                li.className = "list-group-item";
                li.textContent = `${item.name}; Shop: ${item.source}`;
                resultsList.appendChild(li);
            });
        }
    </script>
</body>
</html>
